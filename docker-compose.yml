version: '3.9'

services:
  backend:
    build: .
    container_name: retail-return-backend
    ports:
      - '8000:8000'
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      DATABASE_URL: sqlite:///./backend/return_demo.db
      REDIS_URL: redis://redis:6379/0
      CHROMA_PERSIST_DIRECTORY: ./backend/.chroma
    depends_on:
      - redis
      - chroma
    volumes:
      - .:/app

  redis:
    image: redis:7-alpine
    container_name: retail-return-redis
    ports:
      - '6379:6379'

  chroma:
    image: chromadb/chroma:latest
    container_name: retail-return-chroma
    ports:
      - '8001:8000'
